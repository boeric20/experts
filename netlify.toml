# Netlify builds the expert chat app in web/ with no extra settings.
# Set ANTHROPIC_API_KEY and SITE_PASSWORD in Netlify's environment variables (see README.md).

[build]
  command = "npm ci --prefix web && npm run build --prefix web"
  publish = "web/dist"
  functions = "web/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
